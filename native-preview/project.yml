name: CallCenterChaosPreview
options:
  bundleIdPrefix: com.callcenterchaos
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CallCenterChaosPreview:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.callcenterchaos.preview
        PRODUCT_NAME: CallCenterChaosPreview
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_KEY_CFBundleDisplayName: "Call Center Chaos"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Call Center Chaos"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  CallCenterChaosPreview:
    build:
      targets:
        CallCenterChaosPreview: all
